<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CYBER JANKEN PUZZLE - NEXUS EDITION</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: #030308;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Consolas, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: manipulation;
      overflow: hidden;
    }

    /* CRT Scanline effect */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 30;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
    }

    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 380px;
      z-index: 1;
    }

    /* Top HUD Display */
    #info-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      width: 100%;
      margin-bottom: 6px;
      padding: 8px 10px;
      background: rgba(10, 15, 30, 0.85);
      border-radius: 6px;
      border: 1px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0, 240, 255, 0.1);
    }
    .info-box {
      font-size: 9px;
      font-weight: 900;
      color: #ff0055;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-align: center;
    }
    .info-val {
      color: #00f0ff;
      font-size: 17px;
      font-weight: 900;
      font-family: monospace;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
      margin-top: 2px;
    }

    /* Sub-header displaying next piece & hold queue */
    #next-hold-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 6px;
      padding: 4px 12px;
      background: rgba(15, 10, 25, 0.8);
      border: 1px solid #ff0055;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
    }
    .preview-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: bold;
      color: #ffea00;
    }
    .preview-canvas {
      width: 48px;
      height: 28px;
      background: #080811;
      border: 1px solid #ffea00;
      border-radius: 4px;
    }

    #rule-banner {
      width: 100%;
      padding: 4px;
      background: rgba(255, 0, 85, 0.12);
      border: 1px dashed #ff0055;
      color: #ffea00;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    canvas#canvas {
      background-color: #080811;
      border: 2px solid #00f0ff;
      border-radius: 6px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.9);
      touch-action: none;
    }

    #controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      margin-top: 10px;
    }
    .btn {
      background: linear-gradient(135deg, #121225 0%, #080815 100%);
      color: #00f0ff;
      border: 1.5px solid #00f0ff66;
      border-radius: 8px;
      padding: 12px 0;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset 0 0 8px rgba(0,240,255,0.15);
      transition: all 0.05s ease;
      touch-action: manipulation;
    }
    .btn:active {
      transform: translateY(2px);
      background: #00f0ff;
      color: #05050a;
      box-shadow: 0 0 15px #00f0ff;
    }

    .btn-hard {
      grid-column: span 3;
      background: linear-gradient(135deg, #ffb700 0%, #ff8800 100%);
      color: #000;
      border: 1.5px solid #ffea00;
      font-size: 15px;
      font-weight: 900;
      padding: 12px 0;
      letter-spacing: 2px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
      box-shadow: 0 4px 15px rgba(255, 170, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.5);
    }
    .btn-hard:active {
      background: #ffea00;
      color: #000;
      box-shadow: 0 0 25px #ffea00;
    }

    #banner {
      position: absolute;
      top: 140px;
      left: -100%;
      width: 100%;
      padding: 10px 0;
      background: linear-gradient(90deg, rgba(255,0,85,0.95), rgba(255,215,0,0.95));
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
      box-shadow: 0 0 20px rgba(255,215,0,0.8);
      pointer-events: none;
      z-index: 20;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px #000;
    }
    #banner.slideIn {
      animation: slideBanner 1.1s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes slideBanner {
      0% { left: -100%; }
      25% { left: 0%; }
      75% { left: 0%; }
      100% { left: 100%; }
    }
  </style>
</head>

</div>
