<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Go (WASM) じゃんけんゲーム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Quicksand', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f7f1e3;
    }
    .game-container {
      display: flex;
      width: 920px;
      height: 620px;
      background: #ffffff;
      border: 4px solid #2d3436;
      border-radius: 20px;
      box-shadow: 0 10px 0 #2d3436;
      overflow: hidden;
    }
    .main-area {
      flex: 2;
      display: flex;
      flex-direction: column;
      border-right: 4px solid #2d3436;
      background: #fffdf9;
    }
    .section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-bottom: 3px dashed #dcdde1;
      position: relative;
    }
    .section:last-child { border-bottom: none; }
    .signal-text {
      font-size: 2.2rem;
      font-weight: 900;
      color: #2d3436;
    }
    .hand-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 15px;
      border: 3px solid #dcdde1;
      border-radius: 16px;
      background: #ffffff;
      transition: all 0.15s ease;
      cursor: pointer;
    }
    .hand-card.selected {
      border-color: #ff6b6b;
      background: #ffeaa7;
      transform: translateY(-4px);
      box-shadow: 0 6px 0 #2d3436;
    }
    .player-hands { display: flex; gap: 15px; }
    .key-label {
      font-size: 1.3rem;
      font-weight: 900;
      color: #2d3436;
      margin-top: 5px;
    }
    .history-area {
      flex: 1;
      padding: 20px;
      background: #f1f2f6;
    }
    .history-area h3 {
      text-align: center;
      margin-bottom: 15px;
      color: #2d3436;
      font-size: 1.3rem;
    }
    table { width: 100%; border-collapse: collapse; text-align: center; background: #fff; border-radius: 10px; overflow: hidden; border: 2px solid #2d3436; }
    th, td { padding: 10px; border-bottom: 1px solid #dcdde1; font-size: 0.95rem; }
    th { background: #ffeaa7; color: #2d3436; }
    .instruction {
      font-size: 0.85rem;
      color: #57606f;
      margin-top: 20px;
      text-align: center;
      line-height: 1.6;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #2d3436;
    }
  </style>

  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
      go.run(result.instance);
    });
  </script>
</head>
<body>

<div class="game-container">
  <div class="main-area">
    <!-- 1. 合図 / 勝敗結果 -->
    <div class="section">
      <div id="signal" class="signal-text">スペースキーで開始</div>
      <div id="result"></div>
    </div>

    <!-- 2. コンピュータの手 -->
    <div class="section">
      <div id="com-hand-container">
        <!-- 初期ダミー表示 -->
        <svg width="100" height="100" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="42" fill="#ffeaa7" stroke="#2d3436" stroke-width="4"/>
          <text x="50" y="58" font-size="28" font-weight="bold" fill="#2d3436" text-anchor="middle">?</text>
        </svg>
      </div>
    </div>

    <!-- 3. 自分の手選択 -->
    <div class="section">
      <div class="player-hands">
        <!-- ぐー -->
        <div class="hand-card" id="card-gu">
          <svg width="80" height="80" viewBox="0 0 100 100">
            <rect x="25" y="30" width="50" height="45" rx="20" fill="#FF8A65" stroke="#2D3436" stroke-width="4"/>
            <rect x="35" y="20" width="30" height="25" rx="10" fill="#FF8A65" stroke="#2D3436" stroke-width="4"/>
            <circle cx="42" cy="50" r="4" fill="#2D3436"/><circle cx="58" cy="50" r="4" fill="#2D3436"/>
            <path d="M 45 60 Q 50 65 55 60" fill="none" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
            <circle cx="36" cy="55" r="4" fill="#FFB74D" opacity="0.6"/>
            <circle cx="64" cy="55" r="4" fill="#FFB74D" opacity="0.6"/>
          </svg>
          <span class="key-label">S (ぐー)</span>
        </div>

        <!-- ちょき -->
        <div class="hand-card" id="card-choki">
          <svg width="80" height="80" viewBox="0 0 100 100">
            <rect x="38" y="15" width="10" height="40" rx="5" fill="#4FC3F7" stroke="#2D3436" stroke-width="4"/>
            <rect x="52" y="15" width="10" height="40" rx="5" fill="#4FC3F7" stroke="#2D3436" stroke-width="4"/>
            <rect x="30" y="45" width="40" height="35" rx="15" fill="#4FC3F7" stroke="#2D3436" stroke-width="4"/>
            <circle cx="43" cy="60" r="4" fill="#2D3436"/><circle cx="57" cy="60" r="4" fill="#2D3436"/>
            <path d="M 46 70 Q 50 73 54 70" fill="none" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <span class="key-label">G (ちょき)</span>
        </div>

        <!-- ぱー -->
        <div class="hand-card" id="card-pa">
          <svg width="80" height="80" viewBox="0 0 100 100">
            <rect x="22" y="25" width="8" height="35" rx="4" fill="#81C784" stroke="#2D3436" stroke-width="3"/>
            <rect x="33" y="15" width="8" height="40" rx="4" fill="#81C784" stroke="#2D3436" stroke-width="3"/>
            <rect x="46" y="12" width="8" height="43" rx="4" fill="#81C784" stroke="#2D3436" stroke-width="3"/>
            <rect x="58" y="17" width="8" height="38" rx="4" fill="#81C784" stroke="#2D3436" stroke-width="3"/>
            <rect x="69" y="28" width="8" height="30" rx="4" fill="#81C784" stroke="#2D3436" stroke-width="3"/>
            <rect x="25" y="45" width="50" height="35" rx="12" fill="#81C784" stroke="#2D3436" stroke-width="4"/>
            <circle cx="42" cy="62" r="4" fill="#2D3436"/><circle cx="58" cy="62" r="4" fill="#2D3436"/>
            <path d="M 45 71 Q 50 76 55 71" fill="none" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <span class="key-label">K (ぱー)</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 履歴表示 -->
  <div class="history-area">
    <h3>過去5戦の履歴</h3>
    <table>
      <thead>
        <tr><th>回</th><th>COM</th><th>人間</th><th>結果</th></tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
    <div class="instruction">
      【操作方法】<br>
      <b>[Space]</b>：じゃんけん開始<br>
      <b>[S]</b>：ぐー / <b>[G]</b>：ちょき / <b>[K]</b>：ぱー
    </div>
  </div>
</div>

<!-- Go側から参照する顔付きSVGテンプレート -->
<div style="display:none;">
  <div id="svg-gu">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <rect x="25" y="30" width="50" height="45" rx="20" fill="#FF8A65" stroke="#2D3436" stroke-width="4"/>
      <rect x="35" y="20" width="30" height="25" rx="10" fill="#FF8A65" stroke="#2D3436" stroke-width="4"/>
      <circle cx="42" cy="50" r="4" fill="#2D3436"/><circle cx="58" cy="50" r="4" fill="#2D3436"/>
      <path d="M 45 60 Q 50 65 55 60" fill="none" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
      <circle cx="36" cy="55" r="4" fill="#FFB74D" opacity="0.6"/>
      <circle cx="64" cy="55" r="4" fill="#FFB74D" opacity="0.6"/>
    </svg>
  </div>

  <div id="svg-choki">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <rect x="38" y="15" width="10" height="40" rx="5" fill="#4FC3F7" stroke="#2D3436" stroke-width="4"/>
      <rect x="52" y="15" width="10" height="40" rx="5" fill="#4FC3F7" stroke="#2D3436" stroke-width="4"/>
      <rect x="30" y="45" width="40" height="35" rx="15" fill="#4FC3F7" stroke="#2D3436" stroke-width="4"/>
      <circle cx="43" cy="60" r="4" fill="#2D3436"/><circle cx="57" cy="60" r="4" fill="#2D3436"/>
      <path d="M 46 70 Q 50 73 54 70" fill="none" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>

  <div id="svg-pa">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <rect x="22" y="25" width="8" height="35" rx="4" fill="#81C784" stroke="#2D3436" stroke-width="3"/>
      <rect x="33" y="15" width="8" height="40" rx="4" fill="#81C784" stroke="#2D3436" stroke-width="3"/>
      <rect x="46" y="12" width="8" height="43" rx="4" fill="#81C784" stroke="#2D3436" stroke-width="3"/>
      <rect x="58" y="17" width="8" height="38" rx="4" fill="#81C784" stroke="#2D3436" stroke-width="3"/>
      <rect x="69" y="28" width="8" height="30" rx="4" fill="#81C784" stroke="#2D3436" stroke-width="3"/>
      <rect x="25" y="45" width="50" height="35" rx="12" fill="#81C784" stroke="#2D3436" stroke-width="4"/>
      <circle cx="42" cy="62" r="4" fill="#2D3436"/><circle cx="58" cy="62" r="4" fill="#2D3436"/>
      <path d="M 45 71 Q 50 76 55 71" fill="none" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
</div>

</body>
</html>
