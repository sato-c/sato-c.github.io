<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ドラゴン・騎士・姫 スピードじゃんけん！</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hiragino Maru Gothic ProN', 'Quicksand', sans-serif;
      background: #f7f1e3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #2d3436;
      user-select: none;
    }
    .game-board {
      width: 900px;
      background: #ffffff;
      border: 4px solid #2d3436;
      border-radius: 24px;
      box-shadow: 0 12px 0 #2d3436;
      padding: 25px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }
    .header {
      text-align: center;
    }
    .message-box {
      font-size: 1.2rem;
      font-weight: 900;
      color: #636e72;
      min-height: 30px;
      margin-top: 5px;
    }
    .area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      background: #f1f2f6;
      padding: 15px;
      border-radius: 16px;
      border: 2px dashed #dcdde1;
      min-height: 185px;
      flex-wrap: wrap;
    }
    .field-area {
      background: #ffeaa7;
      border-color: #fdcb6e;
      gap: 25px;
    }
    .card-slot {
      width: 110px;
      height: 155px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .deck-info {
      font-weight: bold;
      font-size: 1.1rem;
      background: #ffffff;
      padding: 12px 20px;
      border-radius: 20px;
      border: 3px solid #2d3436;
      text-align: center;
      box-shadow: 0 4px 0 #dcdde1;
    }
    .key-badge {
      position: absolute;
      bottom: -10px;
      background: #ff6b6b;
      color: white;
      font-weight: 900;
      padding: 2px 14px;
      border-radius: 12px;
      border: 2px solid #2d3436;
      font-size: 1.1rem;
      box-shadow: 0 3px 0 #2d3436;
      z-index: 10;
    }
    .rule-guide {
      display: flex;
      justify-content: space-around;
      background: #fff;
      border: 2px solid #2d3436;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    /* 画面中央オーバーレイメッセージ */
    .center-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(45, 52, 54, 0.95);
      color: #ffeaa7;
      padding: 25px 40px;
      border-radius: 24px;
      border: 4px solid #ffeaa7;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      z-index: 100;
      pointer-events: none;
      display: none;
      width: 85%;
    }
    .center-overlay .title {
      font-size: 2.8rem;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 8px;
    }
    .center-overlay .subtitle {
      font-size: 1.3rem;
      color: #fff;
      font-weight: bold;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="game-board">
  <!-- 画面中央オーバーレイ（カウントダウン・結果用） -->
  <div id="center-overlay" class="center-overlay">
    <div id="overlay-title" class="title">3</div>
    <div id="overlay-subtitle" class="subtitle">出せる手がない！勝負判定まで...</div>
  </div>

  <div class="header">
    <h2>⚔️ スピードじゃんけん ⚔️️</h2>
    <!-- div id="message" class="message-box">SHIFT + SPACE キーを押してゲーム開始！</div -->
    <div id="message" class="message-box">ENTER キーを押してゲーム開始！</div>
  </div>

  <!-- CPUエリア -->
  <div style="text-align: center; font-weight: bold; margin-bottom: -10px;">CPU 手札: <span id="com-hand-count">3</span>枚</div>
  <div id="com-area" class="area"></div>

  <!-- 中央の場札＆共通山札エリア -->
  <div class="area field-area">
    <div class="deck-info">共通山札<br><span id="shared-deck">残: 21</span><br><small style="font-size: 0.75rem; color: #d63031;">[SPACE]で引く</small></div>
    <div id="field-0" class="card-slot"></div>
    <div id="field-1" class="card-slot"></div>
    <div id="field-2" class="card-slot"></div>
  </div>

  <!-- プレイヤーエリア -->
  <div style="text-align: center; font-weight: bold; margin-bottom: -10px;">あなた 手札: <span id="player-hand-count">3</span>枚</div>
  <div id="player-area" class="area"></div>

  <!-- 操作＆相性ガイド -->
  <div class="rule-guide">
    <div>[K] 🗡️ 騎士 ➔ 🐲 竜</div>
    <div>[H] 👸 姫 ➔ 🗡️ 騎士</div>
    <div>[D] 🐲 竜 ➔ 👸 姫</div>
    <div style="color: #d63031;">[SPACE] 出せない時に山札から1枚引く</div>
  </div>
</div>
